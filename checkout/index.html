  <script>
    /* 휴대폰으로 접속하면 모바일 사이트로 이동 (실제 도메인에서만 동작) */
    (function () {
      var MOBILE_URL = 'https://m.plantmatter.kr';
      var LIVE_HOSTS = ['plantmatter.kr', 'www.plantmatter.kr'];
      var LANGS = ['ko', 'en', 'ja'];
      var q = new URLSearchParams(location.search);
      var saved = q.get('lang');
      try {
        if (LANGS.indexOf(q.get('lang')) > -1) localStorage.setItem('pm-lang', q.get('lang'));
        saved = localStorage.getItem('pm-lang');
        localStorage.removeItem('pm-view');   /* 예전 'PC 버전 보기' 설정 정리 */
      } catch (e) {}
      /* 언어: 직접 고른 언어 → 브라우저 언어(한국어·일본어) → 영어 */
      var nav = (navigator.language || '').toLowerCase();
      var hasSaved = LANGS.indexOf(saved) > -1;
      document.documentElement.lang = hasSaved ? saved : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('ja') === 0 ? 'ja' : 'en';
      var phone = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|Opera Mini/i.test(navigator.userAgent);
      if (phone && LIVE_HOSTS.indexOf(location.hostname) > -1) {
        q.delete('view');
        if (hasSaved) q.set('lang', saved);
        var qs = q.toString();
        location.replace(MOBILE_URL + location.pathname + (qs ? '?' + qs : '') + location.hash);
      }
    })();
  </script>

      <h1 class="co__title" data-i18n="checkout">주문/결제</h1>
      <p class="co__test" data-test data-i18n="testMode" hidden>테스트 결제 모드 · 실제로 결제되지 않습니다</p>
    </div>
    <p class="co__member" data-member-note hidden><span data-i18n="memberNote">회원이시면 로그인하고 저장된 정보로 주문할 수 있습니다.</span> <a href="/account/" data-i18n="login">로그인</a></p>
    <div class="co__none" data-none hidden></div>
    <form class="co__body" data-form novalidate>
      <div class="co__main">
        <section class="co__sec" aria-labelledby="h-buyer">
          <h2 class="co__h" id="h-buyer" data-i18n="buyer">주문자 정보</h2>
          <div class="field">
            <label for="f-buyer-name" data-i18n="fName">이름</label>
            <input id="f-buyer-name" name="buyerName" autocomplete="name" maxlength="40" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-buyer-phone" data-i18n="fPhone">휴대폰 번호</label>
            <input id="f-buyer-phone" name="buyerPhone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-buyer-email" data-i18n="fEmail">이메일</label>
            <input id="f-buyer-email" name="buyerEmail" type="email" data-rule="email" autocomplete="email" maxlength="100" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
        </section>
        <section class="co__sec" aria-labelledby="h-ship">
          <h2 class="co__h" id="h-ship" data-i18n="shipTo">배송지</h2>
          <div class="addr-pick" data-addr-pick role="group" aria-label="배송지 선택" data-i18n-attr="aria-label: pickAddr" hidden></div>
          <label class="check"><input type="checkbox" name="same" checked><span class="check__box" aria-hidden="true"></span><span data-i18n="sameAsBuyer">주문자 정보와 같음</span></label>
          <div class="co__recv" data-recv hidden>
            <div class="field">
              <label for="f-recv-name" data-i18n="fRecipient">받는 분</label>
              <input id="f-recv-name" name="recvName" autocomplete="shipping name" maxlength="40">
              <p class="field__err" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="f-recv-phone" data-i18n="fPhone">휴대폰 번호</label>
              <input id="f-recv-phone" name="recvPhone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="shipping tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint">
              <p class="field__err" aria-live="polite"></p>
            </div>
          </div>
          <div class="field">
            <label for="f-zip" data-i18n="fZip">우편번호</label>
            <div class="field__row">
              <input id="f-zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" data-rule="zip" data-digits required>
              <button class="btn-line" type="button" data-addr-find data-i18n="findAddr">주소 찾기</button>
            </div>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-addr" data-i18n="fAddr">주소</label>
            <input id="f-addr" name="addr" autocomplete="shipping address-line1" maxlength="120" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-addr2" data-i18n="fAddr2">상세 주소</label>
            <input id="f-addr2" name="addr2" autocomplete="shipping address-line2" maxlength="80">
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="f-memo" data-i18n="fMemo">배송 메모 (선택)</label>
            <input id="f-memo" name="memo" maxlength="100">
            <p class="field__err" aria-live="polite"></p>
          </div>
        </section>
        <section class="co__sec" aria-labelledby="h-pay">
          <h2 class="co__h" id="h-pay" data-i18n="payMethod">결제 수단</h2>
          <div id="pay-methods" class="co__widget"></div>
        </section>
      </div>
      <aside class="co__side">
        <div class="co__sticky">
          <h2 class="co__h" data-i18n="orderItems">주문 상품</h2>

          <dl class="co-sum" data-sum></dl>
          <div id="pay-agreement" class="co__agree"></div>
          <p class="co__err" data-pay-err role="alert" hidden></p>
          <button class="btn-buy" type="submit" data-pay disabled>결제하기</button>
        </div>
      </aside>

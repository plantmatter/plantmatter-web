  <script>
    /* 휴대폰으로 접속하면 모바일 사이트로 이동 (실제 도메인에서만 동작) */
    (function () {
      var MOBILE_URL = 'https://m.plantmatter.kr';
      var LIVE_HOSTS = ['plantmatter.kr', 'www.plantmatter.kr'];
      var LANGS = ['ko', 'en', 'ja'];
      var q = new URLSearchParams(location.search);
      var saved = q.get('lang');
      try {
        if (LANGS.indexOf(q.get('lang')) > -1) localStorage.setItem('pm-lang', q.get('lang'));
        saved = localStorage.getItem('pm-lang');
        localStorage.removeItem('pm-view');   /* 예전 'PC 버전 보기' 설정 정리 */
      } catch (e) {}
      /* 언어: 직접 고른 언어 → 브라우저 언어(한국어·일본어) → 영어 */
      var nav = (navigator.language || '').toLowerCase();
      var hasSaved = LANGS.indexOf(saved) > -1;
      document.documentElement.lang = hasSaved ? saved : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('ja') === 0 ? 'ja' : 'en';
      var phone = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|Opera Mini/i.test(navigator.userAgent);
      if (phone && LIVE_HOSTS.indexOf(location.hostname) > -1) {
        q.delete('view');
        if (hasSaved) q.set('lang', saved);
        var qs = q.toString();
        location.replace(MOBILE_URL + location.pathname + (qs ? '?' + qs : '') + location.hash);
      }
    })();
  </script>

  <!-- ───────── CONTACT · 도매 문의 ─────────
       양식 처리: assets/js/contact.js → Supabase Edge Function 'wholesale-inquiry' (supabase/functions/) → 운영자 메일 -->
  <main class="ct" id="main">
    <div class="ct__head">
      <p class="crumb"><a href="/contact/">CONTACT</a><span aria-hidden="true">/</span><span data-ct-crumb>B2B</span></p>
      <h1 class="ct__title">CONTACT</h1>
    </div>
    <!-- 분류 탭 (PLANT 목록의 분류 탭과 같은 모양) — 주소 /contact/?c=b2b · ?c=collab -->
    <nav class="pills ct__tabs" aria-label="CONTACT" data-ct-tabs>
      <a class="pill is-active" href="/contact/?c=b2b" data-ct="b2b" aria-current="page">B2B</a>
      <a class="pill" href="/contact/?c=collab" data-ct="collab">COLLAB</a>
    </nav>
    <section class="ct__sec" data-ct-panel="b2b" aria-labelledby="ct-wholesale">
      <h2 class="ct__h" id="ct-wholesale" data-i18n="wsTitle">도매 문의</h2>
      <div class="ct__content">
        <p class="ct__lead" data-i18n="wsLead">식물 매장, 카페·쇼룸 같은 공간, 조경·인테리어 업체의 도매 및 대량 구매 문의를 받습니다.</p>
        <p class="ct__lead ct__lead--sub" data-i18n="wsLead2">아래 양식을 보내 주시면 사업자 확인 후 남겨 주신 연락처로 안내드립니다.</p>
        <dl class="ct__list" data-contact-list hidden></dl>

        <form class="ws" data-ws novalidate>
          <div class="ws__grid">
          <div class="field">
            <label for="w-company" data-i18n="wsCompany">업체명</label>
            <input id="w-company" name="company" autocomplete="organization" maxlength="80" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="w-name" data-i18n="wsName">담당자 성함</label>
            <input id="w-name" name="name" autocomplete="name" maxlength="40" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="w-email" data-i18n="fEmail">이메일</label>
            <input id="w-email" name="email" type="email" data-rule="email" autocomplete="email" maxlength="120" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="w-phone" data-i18n="fPhone">휴대폰 번호</label>
            <input id="w-phone" name="phone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          </div>
          <div class="field">
            <label for="w-type" data-i18n="wsType">업종 (선택)</label>
            <div class="select">
              <select id="w-type" name="bizType">
                <option value="" data-i18n="wsTypeNone">선택해 주세요</option>
                <option value="shop" data-i18n="wsTypeShop">식물 매장·꽃집</option>
                <option value="space" data-i18n="wsTypeSpace">카페·쇼룸 등 공간</option>
                <option value="landscape" data-i18n="wsTypeLandscape">조경·인테리어</option>
                <option value="online" data-i18n="wsTypeOnline">온라인 판매</option>
                <option value="other" data-i18n="wsTypeOther">기타</option>
              </select>
              <svg class="select__chev" viewBox="0 0 14 8" aria-hidden="true"><path d="M1 1l6 6 6-6"/></svg>
            </div>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="w-message" data-i18n="wsMessage">문의 내용 (선택)</label>
            <textarea id="w-message" name="message" rows="4" maxlength="2000"></textarea>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field field--file">
            <label for="w-doc" data-i18n="wsDoc">사업자등록증</label>
            <div class="file">
              <input id="w-doc" name="doc" type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,.webp,application/pdf,image/jpeg,image/png,image/heic,image/heif,image/webp" data-rule="doc" required>
              <span class="file__btn" aria-hidden="true" data-i18n="wsDocPick">파일 선택</span>
              <span class="file__name" data-file-name aria-hidden="true"></span>
            </div>
            <p class="field__hint" data-i18n="wsDocHint">PDF · JPG · PNG 파일, 10MB 이하</p>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="ws__trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <div class="agree" data-agree-box>
            <div class="agree__row">
              <label class="check"><input type="checkbox" data-agree="privacy" required><span class="check__box" aria-hidden="true"></span><span data-i18n="wsAgree">[필수] 개인정보 수집·이용 동의</span></label>
              <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
              <p class="agree__text" data-i18n="wsPrivacyText" hidden></p>
            </div>
            <p class="agree__err" role="alert"></p>
          </div>
          <p class="auth__err" data-err role="alert" hidden></p>
          <button class="btn-buy" type="submit" data-send data-i18n="wsSend">문의 보내기</button>
        </form>

        <div class="ws-done" data-ws-done hidden tabindex="-1">
          <p class="ws-done__title" data-i18n="wsDoneTitle">문의가 접수되었습니다</p>
          <p class="ws-done__text" data-i18n="wsDoneText">확인 후 남겨 주신 이메일이나 휴대폰 번호로 연락드리겠습니다.</p>
          <button class="btn-line" type="button" data-ws-again data-i18n="wsAgain">새 문의 작성</button>
        </div>
      </div>
    </section>

    <section class="ct__sec" data-ct-panel="collab" aria-labelledby="ct-collab" hidden>
      <h2 class="ct__h" id="ct-collab" data-i18n="collabTitle">협업 및 제휴</h2>
      <div class="ct__content">
        <p class="ct__lead" data-i18n="collabLead">브랜드 및 행사 협업 제안을 보내 주세요.</p>

        <form class="ws" data-collab novalidate>
          <div class="ws__grid">
          <div class="field">
            <label for="c-name" data-i18n="collabName">업체 또는 개인명</label>
            <input id="c-name" name="name" autocomplete="organization" maxlength="80" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="c-email" data-i18n="fEmail">이메일</label>
            <input id="c-email" name="email" type="email" data-rule="email" autocomplete="email" maxlength="120" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          </div>
          <div class="field">
            <label for="c-type" data-i18n="collabType">협업 유형</label>
            <input id="c-type" name="collabType" maxlength="80" placeholder="예: 브랜드 협업, 팝업·행사, 전시, 촬영" data-i18n-attr="placeholder: collabTypeHint" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="c-message" data-i18n="collabMessage">제안 내용</label>
            <textarea id="c-message" name="message" rows="4" maxlength="3000" required></textarea>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="c-link" data-i18n="collabLink">관련 링크 (선택)</label>
            <input id="c-link" name="link" type="url" data-rule="url" inputmode="url" autocomplete="url" maxlength="300" placeholder="인스타그램, 웹사이트, 제안서 주소" data-i18n-attr="placeholder: collabLinkHint">
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="ws__trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <div class="agree" data-agree-box>
            <div class="agree__row">
              <label class="check"><input type="checkbox" data-agree="privacy" required><span class="check__box" aria-hidden="true"></span><span data-i18n="wsAgree">[필수] 개인정보 수집·이용 동의</span></label>
              <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
              <p class="agree__text" data-i18n="collabPrivacyText" hidden></p>
            </div>
            <p class="agree__err" role="alert"></p>
          </div>
          <p class="auth__err" data-err role="alert" hidden></p>
          <button class="btn-buy" type="submit" data-send data-i18n="wsSend">문의 보내기</button>
        </form>

        <div class="ws-done" data-collab-done hidden tabindex="-1">
          <p class="ws-done__title" data-i18n="collabDoneTitle">제안이 접수되었습니다</p>
          <p class="ws-done__text" data-i18n="collabDoneText">검토 후 남겨 주신 이메일로 회신드리겠습니다.</p>
          <button class="btn-line" type="button" data-ws-again data-i18n="wsAgain">새 문의 작성</button>
        </div>
      </div>
    </section>
  </main>

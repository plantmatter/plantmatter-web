  <script>
    /* 휴대폰으로 접속하면 모바일 사이트로 이동 (실제 도메인에서만 동작) */
    (function () {
      var MOBILE_URL = 'https://m.plantmatter.kr';
      var LIVE_HOSTS = ['plantmatter.kr', 'www.plantmatter.kr'];
      var LANGS = ['ko', 'en', 'ja'];
      var q = new URLSearchParams(location.search);
      var saved = q.get('lang');
      try {
        if (LANGS.indexOf(q.get('lang')) > -1) localStorage.setItem('pm-lang', q.get('lang'));
        saved = localStorage.getItem('pm-lang');
        localStorage.removeItem('pm-view');   /* 예전 'PC 버전 보기' 설정 정리 */
      } catch (e) {}
      /* 언어: 직접 고른 언어 → 브라우저 언어(한국어·일본어) → 영어 */
      var nav = (navigator.language || '').toLowerCase();
      var hasSaved = LANGS.indexOf(saved) > -1;
      document.documentElement.lang = hasSaved ? saved : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('ja') === 0 ? 'ja' : 'en';
      var phone = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|Opera Mini/i.test(navigator.userAgent);
      if (phone && LIVE_HOSTS.indexOf(location.hostname) > -1) {
        q.delete('view');
        if (hasSaved) q.set('lang', saved);
        var qs = q.toString();
        location.replace(MOBILE_URL + location.pathname + (qs ? '?' + qs : '') + location.hash);
      }
    })();
  </script>

  <!-- ───────── 회원가입 (assets/js/account.js · auth.js) ───────── -->
  <main class="acct" id="main" data-account="signup">
    <section class="auth auth--wide" data-view="form">
      <h1 class="auth__title" data-i18n="signup">회원가입</h1>
      <form class="auth__form" data-signup novalidate>
        <div class="field">
          <label for="s-email" data-i18n="fEmail">이메일</label>
          <input id="s-email" name="email" type="email" data-rule="email" autocomplete="email" maxlength="100" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-pw" data-i18n="fPassword">비밀번호</label>
          <input id="s-pw" name="password" type="password" data-rule="password" autocomplete="new-password" maxlength="72" placeholder="8자 이상" data-i18n-attr="placeholder: pwHint" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-pw2" data-i18n="fPassword2">비밀번호 확인</label>
          <input id="s-pw2" name="password2" type="password" autocomplete="new-password" maxlength="72" data-match="password" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-name" data-i18n="fUserId">아이디</label>
          <input id="s-name" name="name" data-rule="userid" autocomplete="username" maxlength="20" placeholder="2~20자, 한글·영문·숫자 . _ -" data-i18n-attr="placeholder: idHint" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-phone" data-i18n="fPhone">휴대폰 번호</label>
          <input id="s-phone" name="phone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <h2 class="auth__h" data-i18n="defaultAddr">기본 배송지</h2>
        <div class="field">
          <label for="s-zip" data-i18n="fZip">우편번호</label>
          <div class="field__row">
            <input id="s-zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" data-rule="zip" data-digits required>
            <button class="btn-line" type="button" data-addr-find data-i18n="findAddr">주소 찾기</button>
          </div>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-addr" data-i18n="fAddr">주소</label>
          <input id="s-addr" name="addr" autocomplete="address-line1" maxlength="120" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="s-addr2" data-i18n="fAddr2">상세 주소</label>
          <input id="s-addr2" name="addr2" autocomplete="address-line2" maxlength="80">
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="agree" data-agree-box>
          <label class="check check--all"><input type="checkbox" data-agree-all><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeAll">전체 동의</span></label>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="age14" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeAge">[필수] 만 14세 이상입니다</span></label>
          </div>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="terms" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeTerms">[필수] 이용약관 동의</span></label>
            <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
            <p class="agree__text" data-i18n="termsText" hidden></p>
          </div>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="privacy" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreePrivacy">[필수] 개인정보 수집·이용 동의</span></label>
            <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
            <p class="agree__text" data-i18n="privacyText" hidden></p>
          </div>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="marketing"><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeMarketing">[선택] 새 식물·행사 소식 받기 (이메일·문자)</span></label>
            <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
            <p class="agree__text" data-i18n="marketingText" hidden></p>
          </div>
          <p class="agree__err" role="alert"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="signupBtn">가입하기</button>
      </form>
      <p class="auth__links"><span data-i18n="haveAccount">이미 회원이신가요?</span> <a href="/account/" data-i18n="login">로그인</a></p>
    </section>

    <section class="auth" data-view="verify" hidden>
      <h1 class="auth__title" data-i18n="verifyTitle">이메일 확인</h1>
      <p class="auth__text" data-verify-text></p>
      <form class="auth__form" data-verify novalidate>
        <div class="field">
          <label for="v-code" data-i18n="fCode">인증 코드</label>
          <input id="v-code" name="code" data-rule="code" data-digits inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="verifyBtn">확인</button>
      </form>
      <p class="auth__links"><button class="auth__resend" type="button" data-resend data-i18n="resendCode">코드 다시 받기</button></p>
    </section>

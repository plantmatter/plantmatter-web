  <script>
    /* 휴대폰으로 접속하면 모바일 사이트로 이동 (실제 도메인에서만 동작) */
    (function () {
      var MOBILE_URL = 'https://m.plantmatter.kr';
      var LIVE_HOSTS = ['plantmatter.kr', 'www.plantmatter.kr'];
      var LANGS = ['ko', 'en', 'ja'];
      var q = new URLSearchParams(location.search);
      /* /ja/… 주소(일본어로 공유한 링크)로 들어오면 일본어 */
      var saved = LANGS.indexOf(q.get('lang')) > -1 ? q.get('lang') : /^\/ja(\/|$)/.test(location.pathname) ? 'ja' : null;
      try {
        if (saved) localStorage.setItem('pm-lang', saved);
        saved = localStorage.getItem('pm-lang') || saved;
        localStorage.removeItem('pm-view');   /* 예전 'PC 버전 보기' 설정 정리 */
      } catch (e) {}
      /* 언어: 직접 고른 언어 → 브라우저 언어(한국어·일본어) → 영어 */
      var nav = (navigator.language || '').toLowerCase();
      var hasSaved = LANGS.indexOf(saved) > -1;
      document.documentElement.lang = hasSaved ? saved : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('ja') === 0 ? 'ja' : 'en';
      var phone = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|Opera Mini/i.test(navigator.userAgent);
      if (phone && LIVE_HOSTS.indexOf(location.hostname) > -1) {
        q.delete('view');
        if (hasSaved) q.set('lang', saved);
        var qs = q.toString();
        location.replace(MOBILE_URL + location.pathname + (qs ? '?' + qs : '') + location.hash);
      }
    })();
  </script>

  <main class="acct" id="main" data-account="home">
    <p class="acct__loading" data-view="loading" data-i18n="loading">불러오는 중</p>

    <section class="auth" data-view="login" hidden>
      <h1 class="auth__title" data-i18n="login">로그인</h1>
      <form class="auth__form" data-login novalidate>
        <div class="field">
          <label for="l-email" data-i18n="fEmail">이메일</label>
          <input id="l-email" name="email" type="email" data-rule="email" autocomplete="email" maxlength="100" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="l-pw" data-i18n="fPassword">비밀번호</label>
          <input id="l-pw" name="password" type="password" autocomplete="current-password" maxlength="72" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="login">로그인</button>
      </form>
      <p class="auth__links"><a href="/account/reset/" data-i18n="forgotPw">비밀번호 찾기</a></p>
      <div class="auth__join">
        <p data-i18n="noAccount">아직 회원이 아니신가요?</p>
        <a class="btn-line" href="/account/signup/" data-i18n="signup">회원가입</a>
      </div>
      <p class="auth__note" data-i18n="appAccountNote">PLANT MATTER 앱 계정으로도 로그인할 수 있습니다.</p>
    </section>

    <section class="auth" data-view="verify" hidden>
      <h1 class="auth__title" data-i18n="verifyTitle">이메일 확인</h1>
      <p class="auth__text" data-verify-text></p>
      <form class="auth__form" data-verify novalidate>
        <div class="field">
          <label for="v-code" data-i18n="fCode">인증 코드</label>
          <input id="v-code" name="code" data-rule="code" data-digits inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="verifyBtn">확인</button>
      </form>
      <p class="auth__links"><button class="auth__resend" type="button" data-resend data-i18n="resendCode">코드 다시 받기</button></p>
    </section>

    <section class="my" data-view="my" hidden>
      <div class="my__head">
        <h1 class="my__title" data-i18n="myPage">마이페이지</h1>
        <p class="my__hello" data-hello></p>
      </div>

      <form class="my__sec" data-info novalidate>
        <h2 class="my__h"><button class="my__toggle" type="button" aria-expanded="false" aria-controls="sec-accInfo"><span data-i18n="accInfo">회원 정보</span><svg class="acc__chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button></h2>
        <div class="my__body" id="sec-accInfo"><div class="my__inner" inert><div class="my__pad">
        <div class="field">
          <label for="m-email" data-i18n="fEmail">이메일</label>
          <input id="m-email" name="email" type="email" readonly>
        </div>
        <div class="field">
          <label for="m-name" data-i18n="fUserId">아이디</label>
          <input id="m-name" name="name" data-rule="userid" autocomplete="username" maxlength="20" placeholder="2~20자, 한글·영문·숫자 . _ -" data-i18n-attr="placeholder: idHint" required>
          <p class="field__err" aria-live="polite"></p>
          <p class="field__hint" data-name-hint aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="m-realname" data-i18n="fRealName">이름</label>
          <input id="m-realname" name="realname" readonly placeholder="본인인증 후 자동 입력" data-i18n-attr="placeholder: identityPending">
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="m-rrn" data-i18n="fRrn">주민등록번호</label>
          <input id="m-rrn" name="rrn" readonly placeholder="본인인증 후 자동 입력" data-i18n-attr="placeholder: identityPending">
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="m-phone" data-i18n="fPhone">휴대폰 번호</label>
          <input id="m-phone" name="phone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint" required>
          <p class="field__err" aria-live="polite"></p>
          <p class="field__hint" data-phone-hint aria-live="polite"></p>
        </div>
        <p class="my__note" data-i18n="identityNote">이름·주민등록번호·휴대폰 번호는 처음 본인인증을 할 때의 정보로 자동 입력됩니다.</p>
        <label class="check"><input type="checkbox" name="marketing"><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeMarketing">[선택] 새 식물·행사 소식 받기 (이메일·문자)</span></label>
        <div class="agree agree--first" data-first-agree hidden>
          <p class="agree__lead" data-i18n="consentNeeded">웹사이트를 처음 이용하시네요. 아래 항목에 동의해 주세요.</p>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="age14" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeAge">[필수] 만 14세 이상입니다</span></label>
          </div>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="terms" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreeTerms">[필수] 이용약관 동의</span></label>
            <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
            <p class="agree__text" data-i18n="termsText" hidden></p>
          </div>
          <div class="agree__row">
            <label class="check"><input type="checkbox" data-agree="privacy" required><span class="check__box" aria-hidden="true"></span><span data-i18n="agreePrivacy">[필수] 개인정보 수집·이용 동의</span></label>
            <button class="agree__view" type="button" data-view-toggle aria-expanded="false" data-i18n="view">보기</button>
            <p class="agree__text" data-i18n="privacyText" hidden></p>
          </div>
          <p class="agree__err" role="alert"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="save">저장하기</button>
        </div></div></div>
      </form>

      <section class="my__sec" data-addr-book>
        <h2 class="my__h"><button class="my__toggle" type="button" aria-expanded="false" aria-controls="sec-shipAddrs"><span data-i18n="shipAddrs">배송지</span><svg class="acc__chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button></h2>
        <div class="my__body" id="sec-shipAddrs"><div class="my__inner" inert><div class="my__pad">
        <p class="my__note" data-i18n="addrBookNote">기본 배송지 1곳과 추가 배송지 2곳까지 저장할 수 있습니다.</p>
        <ul class="addr-list" data-addr-list></ul>
        <button class="btn-line addr-add" type="button" data-addr-add data-i18n="addrAdd">+ 배송지 추가</button>
        <form class="addr-form" data-addr-form novalidate hidden>
          <p class="addr-form__title" data-addr-form-title></p>
          <div data-addr-extra-fields>
          <div class="field">
            <label for="b-label" data-i18n="addrLabel">배송지 이름 (선택)</label>
            <input id="b-label" name="label" maxlength="20" placeholder="예: 회사, 부모님 댁" data-i18n-attr="placeholder: addrLabelHint">
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="b-name" data-i18n="fRecipient">받는 분</label>
            <input id="b-name" name="name" autocomplete="shipping name" maxlength="40" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="b-phone" data-i18n="fPhone">휴대폰 번호</label>
            <input id="b-phone" name="phone" type="tel" data-rule="phone" data-digits inputmode="numeric" autocomplete="shipping tel" maxlength="13" placeholder="숫자만 입력 (예: 01012345678)" data-i18n-attr="placeholder: fPhoneHint" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          </div>
          <div class="field">
            <label for="b-zip" data-i18n="fZip">우편번호</label>
            <div class="field__row">
              <input id="b-zip" name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" data-rule="zip" data-digits required>
              <button class="btn-line" type="button" data-addr-find data-i18n="findAddr">주소 찾기</button>
            </div>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="b-addr" data-i18n="fAddr">주소</label>
            <input id="b-addr" name="addr" autocomplete="shipping address-line1" maxlength="120" required>
            <p class="field__err" aria-live="polite"></p>
          </div>
          <div class="field">

            <input id="b-addr2" name="addr2" autocomplete="shipping address-line2" maxlength="80">
            <p class="field__err" aria-live="polite"></p>
          </div>
          <p class="auth__err" data-err role="alert" hidden></p>
          <div class="addr-form__btns">
            <button class="btn-buy" type="submit" data-i18n="save">저장하기</button>
            <button class="btn-line" type="button" data-addr-cancel data-i18n="cancel">취소</button>
          </div>
        </form>
        </div></div></div>
      </section>

      <form class="my__sec" data-pw novalidate>
        <h2 class="my__h"><button class="my__toggle" type="button" aria-expanded="false" aria-controls="sec-pwChange"><span data-i18n="pwChange">비밀번호 변경</span><svg class="acc__chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button></h2>

          <input id="m-pw" name="password" type="password" data-rule="password" autocomplete="new-password" maxlength="72" placeholder="8자 이상" data-i18n-attr="placeholder: pwHint" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="m-pw2" data-i18n="fPassword2">비밀번호 확인</label>
          <input id="m-pw2" name="password2" type="password" autocomplete="new-password" maxlength="72" data-match="password" required>
          <p class="field__err" aria-live="polite"></p>
        </div>
        <p class="auth__err" data-err role="alert" hidden></p>
        <button class="btn-buy" type="submit" data-i18n="pwChange">비밀번호 변경</button>
        </div></div></div>

      <section class="my__sec">

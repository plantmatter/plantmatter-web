<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* 휴대폰으로 접속하면 모바일 사이트로 이동 (실제 도메인에서만 동작) */
    (function () {
      var MOBILE_URL = 'https://m.plantmatter.kr';
      var LIVE_HOSTS = ['plantmatter.kr', 'www.plantmatter.kr'];
      var LANGS = ['ko', 'en', 'ja'];
      var q = new URLSearchParams(location.search);
      var saved = q.get('lang');
      try {
        if (LANGS.indexOf(q.get('lang')) > -1) localStorage.setItem('pm-lang', q.get('lang'));
        saved = localStorage.getItem('pm-lang');
        localStorage.removeItem('pm-view');   /* 예전 'PC 버전 보기' 설정 정리 */
      } catch (e) {}
      /* 언어: 직접 고른 언어 → 브라우저 언어(한국어·일본어) → 영어 */
      var nav = (navigator.language || '').toLowerCase();
      var hasSaved = LANGS.indexOf(saved) > -1;
      document.documentElement.lang = hasSaved ? saved : nav.indexOf('ko') === 0 ? 'ko' : nav.indexOf('ja') === 0 ? 'ja' : 'en';
      var phone = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile.+Firefox|Opera Mini/i.test(navigator.userAgent);
      if (phone && LIVE_HOSTS.indexOf(location.hostname) > -1) {
        location.replace(MOBILE_URL + location.pathname + (hasSaved ? '?lang=' + saved : '') + location.hash);
      }
    })();
  </script>
  <title>PLANT MATTER 플랜트매터</title>
  <meta name="description" content="PLANT MATTER 플랜트매터 — 세계의 야생 식물과 자생 환경을 관찰하고 기록합니다.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://plantmatter.kr/">
  <link rel="alternate" media="only screen and (max-width: 640px)" href="https://m.plantmatter.kr/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PLANT MATTER">
  <meta property="og:title" content="PLANT MATTER 플랜트매터">
  <meta property="og:description" content="세계의 야생 식물과 자생 환경을 관찰하고 기록합니다.">
  <meta property="og:url" content="https://plantmatter.kr/">
  <meta property="og:image" content="https://plantmatter.kr/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,700;0,800;1,300;1,700&family=Noto+Sans+KR:wght@300;700&family=Noto+Sans+JP:wght@300;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20261118a">
</head>
<body>
  <!-- ───────── 상단 바 ───────── -->
  <header class="gnb">
    <a class="gnb__logo" href="/" aria-label="PLANT MATTER 홈" data-i18n-attr="aria-label: home">
      <img src="assets/img/wordmark.png" alt="PLANT MATTER" width="2084" height="164">
    </a>

    <!-- 페이지가 생기면 href를 바꾸고 data-soon을 지우면 됩니다 -->
    <nav class="gnb__menu" aria-label="주요 메뉴" data-i18n-attr="aria-label: menu">
      <a href="#" data-soon="PLANT">PLANT</a>
      <a href="#" data-soon="MATTER">MATTER</a>
      <a href="#" data-soon="CONTACT">CONTACT</a>
    </nav>

    <div class="gnb__util">
      <button class="icon-btn" type="button" data-search-open aria-label="검색" data-i18n-attr="aria-label: search" aria-controls="search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
      <a class="icon-btn" href="#" data-soon="account" aria-label="내 정보" data-i18n-attr="aria-label: account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-7 8-7s8 2 8 7"/></svg>
      </a>
      <a class="icon-btn" href="#" data-soon="cart" aria-label="장바구니" data-i18n-attr="aria-label: cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h15l-1.2 12h-12.6z"/><path d="M8.5 8.5V7a3.5 3.5 0 0 1 7 0v1.5"/></svg>
      </a>
    </div>
  </header>

  <!-- ───────── 홈 ───────── -->
  <main class="hero">
    <h1 class="sr-only" data-i18n="title">PLANT MATTER 플랜트매터</h1>
    <picture class="hero__media">
      <source srcset="assets/img/specimen-ficus-murung-raya.webp" type="image/webp">
      <img src="assets/img/specimen-ficus-murung-raya.jpg" alt="흰 배경 위에 놓인 피커스 sp. ‘무룽 라야’의 줄기와 잎" data-i18n-attr="alt: heroAlt" width="1017" height="1100" fetchpriority="high">
    </picture>
  </main>

  <!-- ───────── 하단 ───────── -->
  <footer class="foot">
    <span class="foot__copy">© PLANT MATTER</span>
    <button class="foot__lang" type="button" data-lang-open aria-controls="lang-drawer" aria-expanded="false"><span data-i18n="footLang">VIEW IN KOREAN</span><svg viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg></button>
  </footer>

  <!-- ───────── 검색 ───────── -->
  <div class="search" id="search" aria-hidden="true">
    <div class="search__panel" role="dialog" aria-modal="true" aria-label="검색" data-i18n-attr="aria-label: search">
      <form class="search__form" role="search">
        <label class="sr-only" for="search-input" data-i18n="searchLabel">검색어</label>
        <input id="search-input" type="search" name="q" placeholder="식물 이름, 학명으로 검색" data-i18n-attr="placeholder: searchPlaceholder" autocomplete="off">
        <button class="icon-btn" type="submit" aria-label="검색하기" data-i18n-attr="aria-label: searchSubmit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
      </form>
      <p class="search__msg" aria-live="polite"></p>
      <button class="search__close" type="button" data-search-close>CLOSE</button>
    </div>
    <div class="search__dim" data-search-close></div>
  </div>

  <!-- ───────── 언어 설정 (오른쪽에서 열리는 창) ───────── -->
  <div class="drawer" id="lang-drawer" aria-hidden="true">
    <div class="drawer__dim" data-drawer-close></div>
    <section class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="lang-title">
      <header class="drawer__head">
        <h2 id="lang-title" data-i18n="langTitle">언어 설정</h2>
        <button class="icon-btn drawer__close" type="button" data-drawer-close aria-label="닫기" data-i18n-attr="aria-label: close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </header>
      <form class="drawer__body" id="lang-form">
        <label class="drawer__label" for="lang-select" data-i18n="language">언어 선택</label>
        <div class="select">
          <select id="lang-select" name="lang">
            <option value="ko" lang="ko">한국어</option>
            <option value="en" lang="en">English</option>
            <option value="ja" lang="ja">日本語</option>
          </select>
          <svg class="select__chev" viewBox="0 0 14 8" aria-hidden="true"><path d="M1 1l6 6 6-6"/></svg>
        </div>
        <button class="btn-solid" type="submit" data-i18n="langApply">적용하기</button>
      </form>
    </section>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>


  <script src="assets/js/i18n.js?v=20261118a" defer></script>
  <script src="assets/js/main.js?v=20261118a" defer></script>
</body>
</html>
